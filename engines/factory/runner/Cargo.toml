[package]
name = "runwell-runner"
version = "0.1.0"
edition = "2021"
description = "Claims work from a Runwell factory, runs an AI agent on it in a fresh container, and reports back"
license = "MIT"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde_json = "1"
ctrlc = "3"

[profile.release]
strip = true
lto = true
opt-level = "s"
