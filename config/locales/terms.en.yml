# The words the app uses for its core things. Settings > Names overrides any of them for
# this install; the keys never change.
en:
  terms:
    client:
      one: "Client"
      other: "Clients"
    work:
      one: "Work"
      other: "Work"
    scope_item:
      one: "Section"
      other: "Sections"
    task:
      one: "Task"
      other: "Tasks"
    labels:
      project:
        one: "Project"
        other: "Projects"
        prefix: "P"
      work_order:
        one: "Work order"
        other: "Work orders"
        prefix: "WO"
      service:
        one: "Service"
        other: "Services"
        prefix: "S"
