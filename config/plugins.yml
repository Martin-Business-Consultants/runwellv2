# The plugins Runwell's authors publish, offered in Settings > Plugins. Each is its own public
# repository with releases; any other repository holding a Runwell plugin installs the same way,
# by name. Nothing here is installed until someone installs it.
- key: ai
  repo: Martin-Business-Consultants/runwell-ai
  name: AI
  description: An assistant inside Runwell (Ask, on any page) and one-click suggestions on records, through your own AI provider's key, with a monthly budget. Works through the same tools as MCP, as the person, and changes nothing until they approve it.
  tables: [ ruby_llm_ ]
- key: account_management
  repo: Martin-Business-Consultants/runwell-account-management
  name: Account management
  description: Keeps every client in play for your project managers. A Today list, every contact logged and quiet clients flagged, replies within a business day, meeting rhythms with drafted agendas, nudges, weekly health, checklists, backup leads and a client digest.
- key: cloudflare
  repo: Martin-Business-Consultants/runwell-cloudflare
  name: Cloudflare
  description: Behind Cloudflare, records visitors' real addresses and trusts its https, from Cloudflare's own ranges only.
- key: coding
  repo: Martin-Business-Consultants/runwell-coding
  name: Code
  description: Git repositories on clients, engagements and work; GitHub pull requests, checks, deploys and issues; branches and briefs for coding agents.
- key: factory
  repo: Martin-Business-Consultants/runwell-factory
  name: Factory
  description: Ready work queued for AI agents running unattended on runners, with limits, leases, attempts and costs.
- key: google_ads
  repo: Martin-Business-Consultants/runwell-google-ads
  name: Google Ads
  description: Read-only Google Ads reporting on engagements, shared with the client in the portal, with alerts when an account stops serving.
- key: outsend
  repo: Martin-Business-Consultants/runwell-outsend
  name: Outsend
  description: Sends Runwell's mail through Outsend instead of SMTP.
- key: qa
  repo: Martin-Business-Consultants/runwell-qa
  name: QA
  description: Each client's source of truth as checks and expectations, with test runs, issues and gates that keep work from done until it passes.
- key: quickbooks
  repo: Martin-Business-Consultants/runwell-quickbooks
  name: QuickBooks
  description: Clients linked to QuickBooks customers, recurring invoices kept in step with services, and fixed-price work invoiced from its panel.
- key: reporting
  repo: Martin-Business-Consultants/runwell-reporting
  name: Reporting
  description: Billed, collected, aging and recurring coverage from the QuickBooks plugin's mirror, and QuickBooks' profit and loss.
- key: stripe_billing
  repo: Martin-Business-Consultants/runwell-stripe-billing
  name: Stripe
  description: Payment links for approved agreements, on the approval page and by email; a subscription for a service, a one-time payment for fixed work, each marked paid by Stripe or by hand.
- key: time_tracking
  repo: Martin-Business-Consultants/runwell-time-tracking
  name: Time tracking
  description: Log time on clients, engagements and work, with totals and a weekly timesheet.
