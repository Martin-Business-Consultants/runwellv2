# Publishes the production image for each release, ghcr.io/martin-business-consultants/runwell:<version>
# for amd64 and arm64, which Hoster's Runwell template installs. Each architecture builds on its own
# runner and pushes by digest; one manifest then names both. An existing release backfills from main,
# with this file: `gh workflow run image.yml -f tag=v2.1.2`. The package must be public for an install to pull it.
name: Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, like v2.1.2
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/martin-business-consultants/runwell

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Keep the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tagged with VERSION rather than the ref, so a manual run from a tag names the same image. No latest:
      # a backfill would move it backwards, and the template pins a version anyway.
      - name: Tag both architectures as the version
        working-directory: digests
        run: |
          version="$(tr -d '[:space:]' < ../VERSION)"
          docker buildx imagetools create -t "$IMAGE:$version" \
            $(printf "$IMAGE@sha256:%s " *)
