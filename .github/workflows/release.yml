# Publishes a release when a version tag is pushed (bin/release does both). Every install's
# nightly check then sees it, and Settings > Updates offers it to the owner. Each release carries
# the bundle a Docker install updates itself with (Upgrade::InPlace): the Dockerfile's `bundle`
# stage for amd64 and arm64, with its checksum, and a manifest naming the Ruby and base it needs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION ($version). Cut releases with bin/release."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Runwell ${GITHUB_REF_NAME#v}"

      - name: Attach the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ruby_version="$(sed -n 's/^ARG RUBY_VERSION=//p' Dockerfile)"
          base="$(sed -n 's/.*RUNWELL_BASE="\([^"]*\)".*/\1/p' Dockerfile)"
          printf '{"version":"%s","ruby":"%s","base":"%s"}\n' "${GITHUB_REF_NAME#v}" "$ruby_version" "$base" > "runwell-$GITHUB_REF_NAME.json"
          gh release upload "$GITHUB_REF_NAME" "runwell-$GITHUB_REF_NAME.json"

  bundle:
    needs: release
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the bundle
        run: docker buildx build --target bundle --platform "linux/${{ matrix.arch }}" --output type=tar,dest=bundle.tar .

      - name: Attach it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="runwell-$GITHUB_REF_NAME-linux-${{ matrix.arch }}.tar.gz"
          gzip -c bundle.tar > "$name"
          sha256sum "$name" > "$name.sha256"
          gh release upload "$GITHUB_REF_NAME" "$name" "$name.sha256"
